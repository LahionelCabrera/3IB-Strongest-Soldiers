<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Domino</title>
  </head>
  <body>













    <!-- Template della tessera completa -->
    <template id="domino">
      <div class="Domino">
        <div class="sopra"></div>
        <hr class="linea" />
        <div class="sotto"></div>
      </div>
    </template>

    <template id="d0">
      <div class="Quadretti">
      </div>
    </template>

    <!-- Template valore 1 -->
    <template id="d1">
      <div class="Quadretti D1">
        <div class="Pallina"></div>
      </div>
    </template>

    <!-- Template valore 2 -->
    <template id="d2">
      <div class="Quadretti D2">
        <div class="Pallina"></div>
        <div class="Pallina"></div>
      </div>
    </template>

    <!-- Template valore 3 -->
    <template id="d3">
      <div class="Quadretti D3">
        <div class="Pallina"></div>
        <div class="Pallina"></div>
        <div class="Pallina"></div>
      </div>
    </template>

    <!-- Template valore 4 -->
    <template id="d4">
      <div class="Quadretti D4">
        <div class="Pallina"></div>
        <div class="Pallina"></div>
        <div class="Pallina"></div>
        <div class="Pallina"></div>
      </div>
    </template>

    <!-- Template valore 5 -->
    <template id="d5">
      <div class="Quadretti D5">
        <div class="Pallina"></div>
        <div class="Pallina"></div>
        <div class="Pallina PD5"></div>
        <div class="Pallina"></div>
        <div class="Pallina"></div>
      </div>
    </template>

    <!-- Template valore 6 -->
    <template id="d6">
      <div class="Quadretti D6">
        <div class="Pallina"></div>
        <div class="Pallina"></div>
        <div class="Pallina"></div>
        <div class="Pallina"></div>
        <div class="Pallina"></div>
        <div class="Pallina"></div>
      </div>
    </template>


    <div id="menu-principale">
      <section class="pannello-menu" aria-labelledby="titolo-menu">
        <h1 id="titolo-menu">Domino</h1>
        <p>Scegli un nome per iniziare.</p>

        <label for="username">Nome</label>
        <input id="username" type="text" placeholder="Il tuo nome" maxlength="24" autocomplete="nickname" />
        <button id="gioca" type="button" onclick="iniziaGioco()">Gioca</button>

        <label for="id">ID partita (facoltativo)</label>
        <div class="riga-join">
          <input id="id" type="text" placeholder="ID partita" autocomplete="off" />
          <button id="join" type="button" onclick="joinGioco()">Join</button>
        </div>
        <p id="messaggio" role="status" aria-live="polite"></p>
      </section>
    </div>


    
    <script src="./script.js"></script>
  </body>
</html>
