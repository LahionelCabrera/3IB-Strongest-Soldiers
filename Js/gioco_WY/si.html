<!doctype html>
<html lang="it">

<head>
  <title>Indovina Chi?</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

  <!-- Font Awesome per le icone -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <link rel="stylesheet" href="indovina.css">
</head>

<body class="bg-light">

  <!-- Contenitore a tutta altezza che centra la finestra -->
  <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">

    <!-- La "finestra" -->
    <div class="card shadow-lg text-center" style="width: 100%; max-width: 40rem;">

      <!-- Titolo -->
      <div class="card-header py-4">
        <h1 class="mb-0 display-4">Indovina Chi? <i class="fa fa-child" aria-hidden="true"></i></h1>
      </div>

      <!-- Form + pulsante -->
      <div class="card-body p-5">
        <form id="formGioca" action="indovina.html" method="get">

          <div class="form-group text-left">
            <label for="nomeUtente" class="font-weight-bold">Nome utente</label>
            <input type="text" id="nomeUtente" name="nome" class="form-control form-control-lg"
              placeholder="Inserisci il tuo nome" required>
          </div>

          <div class="form-group text-left">
            <label for="idUtente" class="font-weight-bold">
              ID <small class="text-muted">(facoltativo)</small>
            </label>

            <input type="text" id="idUtente" name="id" class="form-control form-control-lg"
              placeholder="Inserisci l'ID">

            <small id="erroreId" class="text-danger"></small>
          </div>

          <button type="submit" class="btn btn-primary btn-lg btn-block mt-4 py-3" style="font-size: 2rem;"
            title="gioca" id="btn_gioca">
            <i class="fa fa-play" aria-hidden="true"></i> Gioca
          </button>

        </form>
      </div>

    </div>

  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
    integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
    crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
    integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
    crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
    integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
    crossorigin="anonymous"></script>
  <script src="indovina.js"></script>
</body>

</html>
